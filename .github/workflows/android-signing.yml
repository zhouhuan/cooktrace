name: android-signing

# One-time signing-key bootstrap. This workflow is intentionally manual-only.
# Create the three password/alias repository secrets before running it.
# The private keystore is uploaded as a short-lived artifact; never print it
# or its base64 representation to the Actions log.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  init-signing:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Create the repository Actions secret $name before running this workflow"
              exit 1
            fi
          done
          if [ ${#KEYSTORE_PASSWORD} -lt 20 ] || [ ${#KEY_PASSWORD} -lt 20 ]; then
            echo "::error::Signing passwords must be at least 20 characters"
            exit 1
          fi
          if [ "$KEY_ALIAS" != "cooktrace" ]; then
            echo "::error::KEY_ALIAS must be cooktrace"
            exit 1
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          keytool -genkeypair -v \
            -keystore cooktrace-release.keystore \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=CookTrace, OU=Apps, O=zhouhuan, C=CN"
          echo "Keystore generated. No private-key material or password is printed to logs."
          echo "Download the short-lived release-keystore artifact and back up the file offline."
          echo "Locally base64-encode the file and add it as the repository Actions secret KEYSTORE_BASE64."
          ls -lh cooktrace-release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: cooktrace-release.keystore
          retention-days: 1
